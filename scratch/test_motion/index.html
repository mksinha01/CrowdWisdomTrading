<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test Motion Audio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #07090e; color: #fff; font-family: sans-serif; overflow: hidden; }
    #root { width: 1080px; height: 1920px; position: relative; background: #07090e; }
    .clip { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .title { font-size: 72px; font-weight: 900; color: #00f0ff; text-shadow: 0 0 30px #00f0ff; opacity: 0; }
  </style>
  <script src="gsap.min.js"></script>
</head>
<body>
  <div id="root" data-composition-id="root" data-width="1080" data-height="1920" data-duration="2">
    <audio id="vo" data-start="0" data-duration="2" data-volume="1.0" src="vo.mp3"></audio>
    <div id="scene1" class="clip" data-start="0" data-duration="2">
      <h1 id="title1" class="title">MOTION GRAPHICS</h1>
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.to("#title1", { opacity: 1, scale: 1.2, duration: 1.0 }, 0);
    window.__timelines = window.__timelines || {};
    window.__timelines["root"] = tl;
  </script>
</body>
</html>
